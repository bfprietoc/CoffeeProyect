name: CI

# CI del backend: calidad estática + tests unitarios (stores en memoria,
# sin servicios externos). El E2E de stack completo vive en el repo web
# (e2e.yml), que chequea este repo en `develop`.
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - run: go vet ./...
      - run: go build ./...
      # -race: los stores en memoria usan mutex; detecta data races de gratis.
      - run: go test -race -count=1 ./...
